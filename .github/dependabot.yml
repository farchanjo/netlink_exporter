# Dependabot configuration — DSC-011
# Weekly automated dependency updates for Cargo and GitHub Actions.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ---------------------------------------------------------------------------
  # Cargo (Rust) — workspace dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    # Group all Cargo updates into one PR to avoid noise.
    groups:
      cargo-all:
        patterns:
          - "*"
    # Limit open PRs at any one time.
    open-pull-requests-limit: 5
    # Commit message prefix for easier filtering.
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"

  # ---------------------------------------------------------------------------
  # GitHub Actions — pin actions to SHA refs where possible
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    groups:
      actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
