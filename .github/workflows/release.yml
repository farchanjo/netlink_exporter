name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# DSC-004: top-level read-only default; per-job overrides grant write only where needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nft_exporter

jobs:
  # ---------------------------------------------------------------------------
  # Build static musl binaries for both target architectures
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_suffix: x86_64
            use_cross: false
            linker: musl-tools
          - target: aarch64-unknown-linux-musl
            artifact_suffix: aarch64
            use_cross: true
            linker: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable >= 1.87)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87"
          targets: ${{ matrix.target }}

      - name: Install musl linker tools (x86_64 only)
        if: matrix.linker != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.linker }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install cross (aarch64 only)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary — ${{ matrix.target }} (native)
        if: "!matrix.use_cross"
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Build release binary — ${{ matrix.target }} (cross)
        if: matrix.use_cross
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Rename and stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nft_exporter \
             dist/nft_exporter-${{ matrix.artifact_suffix }}
          chmod +x dist/nft_exporter-${{ matrix.artifact_suffix }}

      - name: Verify binary is statically linked (x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          ldd dist/nft_exporter-${{ matrix.artifact_suffix }} 2>&1 | \
            grep -q "not a dynamic executable" || \
            { echo "ERROR: binary is not statically linked"; exit 1; }

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum nft_exporter-${{ matrix.artifact_suffix }} \
            > nft_exporter-${{ matrix.artifact_suffix }}.sha256
          cat nft_exporter-${{ matrix.artifact_suffix }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft_exporter-${{ matrix.artifact_suffix }}
          path: |
            dist/nft_exporter-${{ matrix.artifact_suffix }}
            dist/nft_exporter-${{ matrix.artifact_suffix }}.sha256
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Build and push multi-arch container image
  # ---------------------------------------------------------------------------
  build-push-container:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
      id-token: write   # required for cosign OIDC keyless signing

    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: nft_exporter-x86_64
          path: dist/linux/amd64

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: nft_exporter-aarch64
          path: dist/linux/arm64

      - name: Rename binaries to uniform name for Dockerfile COPY
        run: |
          mv dist/linux/amd64/nft_exporter-x86_64 dist/linux/amd64/nft_exporter
          mv dist/linux/arm64/nft_exporter-aarch64 dist/linux/arm64/nft_exporter
          chmod +x dist/linux/amd64/nft_exporter dist/linux/arm64/nft_exporter

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch container image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image (keyless OIDC)
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}"

      # DSC-003: anchore/sbom-action/download-syft pinned to a specific commit SHA.
      # TODO: replace the placeholder SHA below with the verified commit SHA for the
      # desired release of anchore/sbom-action (https://github.com/anchore/sbom-action/releases).
      # Example: anchore/sbom-action/download-syft@e5d6eb3f0fba07f5b12195a5f2b2a3c8db50e29e
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e5d6eb3f0fba07f5b12195a5f2b2a3c8db50e29e  # TODO: verify SHA for anchore/sbom-action v0.x

      - name: Generate SPDX-JSON SBOM and attach as OCI referrer
        run: |
          syft \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}" \
            --output spdx-json=sbom.spdx.json
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdx \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Scan container image for CVEs (Trivy)
  # DSC-003: aquasecurity/trivy-action pinned to a specific commit SHA.
  # ---------------------------------------------------------------------------
  scan-image:
    name: CVE scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-push-container
    permissions:
      contents: read
      security-events: write

    steps:
      # DSC-003: trivy-action pinned to commit SHA instead of @master.
      # TODO: replace the placeholder SHA below with the verified commit SHA for the
      # desired release of aquasecurity/trivy-action (https://github.com/aquasecurity/trivy-action/releases).
      # Example: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37  # TODO: verify SHA for trivy-action v0.31.0+
        with:
          image-ref: >-
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-push-container.outputs.image_digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Create GitHub Release and attach binary artifacts
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-binaries
      - build-push-container
      - scan-image
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nft_exporter-*
          path: release-assets
          merge-multiple: false

      - name: Flatten release assets
        run: |
          mkdir -p flat
          find release-assets -type f | while read f; do
            cp "$f" flat/
          done
          ls -lh flat/

      - name: Generate release notes from git log
        id: release-notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline "${PREV_TAG}..HEAD" --no-merges)
          else
            NOTES=$(git log --oneline --no-merges)
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "## What's Changed"
            echo ""
            echo "$NOTES"
            echo ""
            echo "## Container image"
            echo ""
            echo "\`\`\`"
            echo "docker pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
            echo "\`\`\`"
            echo ""
            echo "Image digest: \`${{ needs.build-push-container.outputs.image_digest }}\`"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release-notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: flat/*
          fail_on_unmatched_files: true
          generate_release_notes: false
