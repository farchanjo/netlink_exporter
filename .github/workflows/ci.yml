name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  SPEC_FRAMEWORK: spec-framework

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Architecture invariants — lock-free (ADR-0023) + native-API (ADR-0025)
  # ---------------------------------------------------------------------------
  invariants:
    name: Architecture invariants (lock-free + native-API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Mutex/RwLock — ADR-0023 lock-free invariant
        run: |
          if grep -rnE 'std::sync::(Mutex|RwLock)|parking_lot::' crates --include='*.rs'; then
            echo "::error::lock found — ADR-0023 requires lock-free (arc-swap + atomics)"; exit 1
          fi
          echo "ok: no Mutex/RwLock"
      - name: No /proc or /sys reads — ADR-0025 native-API-only
        run: |
          if grep -rnE '"/(proc|sys)/' crates --include='*.rs'; then
            echo "::error::/proc or /sys string literal in exporter code — ADR-0025 native-API-only"; exit 1
          fi
          echo "ok: no procfs/sysfs reads"

  # ---------------------------------------------------------------------------
  # Job 1: Spec validation (CUE vet + Gherkin syntax + full fast lane)
  # ---------------------------------------------------------------------------
  spec-validate:
    name: Spec validate (${{ matrix.script }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - lint_cue
          - lint_features
          - lint_ddd_role
          - lint_madr
          - lint_yaml
          - lint_md
          - lint_mermaid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout spec-framework
        uses: actions/checkout@v4
        with:
          repository: eonf/spec-framework
          path: spec-framework
          # If the repository is private, provide a PAT via:
          # token: ${{ secrets.SPEC_FRAMEWORK_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          working_directory: spec-framework

      - name: Install spec-framework Python deps
        run: uv sync --project spec-framework

      - name: Run ${{ matrix.script }}
        env:
          SPEC_ROOT: docs/arch
        run: |
          mise exec -C spec-framework -- \
            uv run --project spec-framework \
            python spec-framework/scripts/${{ matrix.script }}.py

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-report-${{ matrix.script }}
          path: .spec-reports/*.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 2: Rust fmt + clippy + build (matrix: x86_64 and aarch64 musl)
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            linker: musl-tools
            use_cross: false
          - target: aarch64-unknown-linux-musl
            linker: ""
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable >= 1.87)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87"
          components: rustfmt,clippy
          targets: ${{ matrix.target }}

      - name: Install musl linker tools (x86_64 only)
        if: matrix.linker != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.linker }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # rustfmt check runs only once (host target is sufficient)
      - name: Check formatting (rustfmt)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo fmt --all -- --check

      # clippy runs against the host target to avoid cross-compilation overhead;
      # the musl target is verified by the build step below.
      - name: Clippy (host target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::indexing_slicing \
            -A clippy::arithmetic_side_effects

      - name: Install cross (aarch64 only)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary — ${{ matrix.target }} (native)
        if: "!matrix.use_cross"
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Build release binary — ${{ matrix.target }} (cross)
        if: matrix.use_cross
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Verify binary is statically linked
        run: |
          BIN=$(find target/${{ matrix.target }}/release -maxdepth 1 -type f -perm /111 | head -1)
          echo "Checking: $BIN"
          file "$BIN"
          # On host x86_64 only (ldd/file unavailable for foreign arch)
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            ldd "$BIN" 2>&1 | grep -q "not a dynamic executable" || \
              { echo "ERROR: binary is not statically linked"; exit 1; }
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft_exporter-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nft_exporter
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Container build (no push on PR)
  # ---------------------------------------------------------------------------
  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: rust
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: nft_exporter-x86_64-unknown-linux-musl
          path: dist/linux/amd64

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: nft_exporter-aarch64-unknown-linux-musl
          path: dist/linux/arm64

      - name: Make binaries executable
        run: chmod +x dist/linux/amd64/nft_exporter dist/linux/arm64/nft_exporter

      - name: Set up QEMU (multi-arch build support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/nft_exporter:pr-${{ github.event.number }}
            ghcr.io/${{ github.repository_owner }}/nft_exporter:${{ github.sha }}
          build-args: |
            BUILDPLATFORM=$BUILDPLATFORM
            TARGETPLATFORM=$TARGETPLATFORM
