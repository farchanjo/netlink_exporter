[workspace]
resolver = "3"
members = [
    "crates/nlx-domain",
    "crates/nlx-ports",
    "crates/nlx-netlink",
    "crates/nlx-metrics",
    "crates/nlx-http",
    "crates/nlx-config",
    "crates/netlink_exporter",
]

# ADR-0003: edition 2024, MSRV 1.87
[workspace.package]
edition = "2024"
rust-version = "1.87"
authors = ["eonf"]
license = "MIT OR Apache-2.0"

# ---------------------------------------------------------------------------
# Shared dependency table — all workspace crates reference these via
# `{ workspace = true }` to keep version pins in one place.
# ADR-0011: direct wire protocol stack (rustix, linux-raw-sys, zerocopy,
#           bytemuck, byteorder).
# ADR-0014: tokio 1.52 + mio 1.0 confined to driven adapters only.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- wire protocol (ADR-0011) ---
rustix          = { version = "1.1", features = ["net", "process"] }
linux-raw-sys   = { version = "0.12", features = ["general", "net", "netlink"] }
libc            = { version = "0.2" }
zerocopy        = { version = "0.8", features = ["derive"] }
bytemuck        = { version = "1.25", features = ["derive"] }
byteorder       = { version = "1.5" }

# --- async runtime (ADR-0023 — DRIVEN ADAPTERS + BINARY ONLY) ---
# monoio: io_uring-first thread-per-core runtime; legacy feature = epoll fallback.
# tokio/mio/axum/tower REMOVED per ADR-0023.
monoio          = { version = "0.2", features = ["iouring", "legacy", "macros", "poll-io", "sync"] }
io-uring        = { version = "0.7", default-features = false }

# --- lock-free RCU cross-thread snapshot sharing (ADR-0023) ---
arc-swap        = { version = "1.7" }

# --- HTTP exposition (ADR-0023) ---
# Hand-rolled HTTP/1 over monoio::net; monoio-http/service-async NOT pulled in
# because the recon confirmed hand-rolled works without those deps (ADR-0023 deviation
# noted: the ADR mentions monoio-http 0.3.12 but the hand-rolled approach is
# simpler and avoids ByteDance-internal crates with limited community docs).
# monoio-http  = { version = "0.3", features = ["parsed"] }   # deferred
# service-async = { version = "0.2" }                          # deferred

# --- privilege (ADR-0009) ---
caps            = { version = "0.5" }

# --- configuration (ADR-0013/0015) ---
figment         = { version = "0.10", features = ["toml", "env"] }
clap            = { version = "4", features = ["derive", "env"] }

# --- serialisation ---
serde           = { version = "1", features = ["derive"] }

# --- error handling ---
thiserror       = { version = "2" }
anyhow          = { version = "1" }

# --- tracing ---
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- parsing ---
regex           = { version = "1.11" }
toml            = { version = "1.1" }

# --- workspace-internal ---
nlx-domain      = { path = "crates/nlx-domain" }
nlx-ports       = { path = "crates/nlx-ports" }
nlx-netlink     = { path = "crates/nlx-netlink" }
nlx-metrics     = { path = "crates/nlx-metrics" }
nlx-http        = { path = "crates/nlx-http" }
nlx-config      = { path = "crates/nlx-config" }

# ---------------------------------------------------------------------------
# Shared lint baseline — Layer A (rustc), B (clippy pedantic), C (deny list)
# All workspace members inherit via `[lints] workspace = true`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code            = "warn"   # warn; every block requires a SAFETY comment
missing_docs           = "warn"
unused_must_use        = "deny"
future_incompatible    = { level = "deny", priority = -1 }
nonstandard_style      = { level = "deny", priority = -1 }
rust_2018_idioms       = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic               = { level = "warn", priority = -1 }
# Layer B — promote critical pedantic subsets to deny
missing_errors_doc     = "deny"
missing_panics_doc     = "deny"
# Layer C — blanket deny
unwrap_used            = "deny"
expect_used            = "deny"
panic                  = "deny"
indexing_slicing       = "warn"
arithmetic_side_effects = "warn"

# ---------------------------------------------------------------------------
# Release profile — abort on panic so a capability-drop failure or any other
# unexpected panic terminates the process immediately without unwinding.
# Unwinding is both slower and a source of subtle post-panic state bugs.
# This does NOT affect test or dev profiles (SEC-PRIV-001, ADR-0009).
# ---------------------------------------------------------------------------
[profile.release]
panic = "abort"
