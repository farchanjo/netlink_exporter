[package]
name        = "nlx-netlink"
version     = "0.1.0"
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true
description = "Driven infrastructure adapters: AF_NETLINK socket transport + per-subsystem collectors (ADR-0011, ADR-0023)."

# ADR-0023: monoio (io_uring-first) replaces tokio + mio in this crate.
# poll-io feature enables spawn_blocking for the blocking AF_NETLINK dump path.
# tokio and mio are REMOVED per ADR-0023.
[dependencies]
nlx-domain   = { workspace = true }
nlx-ports    = { workspace = true }
libc         = { workspace = true }
monoio       = { workspace = true, features = ["sync"] }
io-uring     = { workspace = true }
rustix       = { workspace = true }
linux-raw-sys = { workspace = true }
zerocopy     = { workspace = true }
bytemuck     = { workspace = true }
byteorder    = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
# caps: drop listener-thread privileges to empty after privileged setup
# (SEC-PRIV-002 / ADR-0026 — recv loop needs no capabilities).
caps         = { workspace = true }

[lints]
workspace = true
